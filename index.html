function attendanceView(secId,q){
  const sec=get('sections',secId); if(!sec){ location.hash='#/attendance'; return; }
  const meets=sec.meetings||[];
  // Only real class days can be selected: the section's meeting weekdays between its start and end dates.
  // (A section without meeting times allows any day between its start and end dates.)
  const DAYLIST=meets.length?classDays(sec,-1):(()=>{ const out=[]; if(sec.start_date&&sec.end_date) for(let d=D(sec.start_date);d<=D(sec.end_date);d.setDate(d.getDate()+1)) out.push(iso(d)); return out; })();
  const ALLOWED=new Set(DAYLIST);
  // Which meeting time belongs to a date (e.g. Monday → "Monday 6–8 PM")
  const miFor=(date,pref)=>{ if(!meets.length) return -1; const dow=D(date).getDay(); const idx=meets.map((m,i)=>m.day===dow?i:-1).filter(i=>i>=0); return idx.includes(pref)?pref:(idx.length?idx[0]:pref); };
  const latest=list=>{ const t=today(), past=list.filter(d=>d<=t); return past.length?past[past.length-1]:(list[0]||null); };
  const qmi=Number(q.get('mi'));
  const S={tab:['qr','history'].includes(q.get('tab'))?q.get('tab'):'manual',mi:meets.length?(qmi>=0&&qmi<meets.length?qmi:0):-1,date:null,month:null,draft:null,dirty:false};
  S.date=ALLOWED.has(q.get('date'))?q.get('date'):(latest(DAYLIST)||today());
  S.mi=miFor(S.date,S.mi); S.month=S.date.slice(0,7);
  const go=async(date,mi,tab=S.tab)=>{
    if(!ALLOWED.has(date)) return;
    if(!await confirmLeave()) return;
    S.date=date; S.mi=mi??miFor(date,S.mi); S.tab=tab; S.month=date.slice(0,7); S.draft=null; S.dirty=false; $('#amt').value=S.mi; drawCal(); drawPane();
  };
  const schedLabel=()=>S.mi>=0?meetLabel(meets[S.mi]):'Any time';

  app.innerHTML=pageHead({crumbs:[['#/attendance','Attendance'],['',secName(sec)]],title:'Attendance',
      sub:`${esc(secName(sec))} · <span class="code">${esc(courseCode(get('courses',sec.course_id)))}</span>`,
      actions:btn(`#/sections/view/${sec.id}`,'eye','View section','secondary')})+`
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="manual">${icon('calendar',16)}Manual entry</button>
      <button role="tab" data-tab="qr">${icon('qr',16)}Self check-in QR</button>
      <button role="tab" data-tab="history">${icon('list',16)}History</button>
    </div>
    <div id="pendBar"></div>
    <div class="att">
      <section class="card pad">
        <h3 class="h3">Class date</h3><p class="muted small" style="margin:2px 0 14px">Select a schedule and a date to mark or correct attendance.</p>
        <div class="f"><label for="amt">Intended schedule</label>
          <select id="amt">${meets.length?meets.map((m,i)=>`<option value="${i}">${esc(meetLabel(m))}</option>`).join(''):'<option value="-1">No schedule set (any day)</option>'}</select>
          ${meets.length?'':`<small class="help">Add meeting times in <a href="#/sections/edit/${sec.id}">Edit section</a> to highlight class days.</small>`}</div>
        <div class="f" style="margin-top:14px"><span class="lb">Attendance date</span><div id="cal"></div></div>
      </section>
      <section class="card" id="pane"></section>
    </div>`;

  const confirmLeave=async()=>!S.dirty||await ask({title:'Discard unsaved changes?',msg:'You marked attendance for this date but did not save it.',ok:'Discard'});
  const drawCal=()=>{
    const [y,m]=S.month.split('-').map(Number);
    const first=new Date(y,m-1,1), dim=new Date(y,m,0).getDate(), cellsN=Math.ceil((first.getDay()+dim)/7)*7;
    const rec=new Set(db.attendance.filter(a=>a.section_id===sec.id).map(a=>a.date));
    const pend=new Set(pendingDays(sec).map(p=>p.date));
    // Months that contain class days: the arrows jump straight between them
    const months=[...new Set(DAYLIST.map(d=>d.slice(0,7)))];
    const prevM=[...months].reverse().find(x=>x<S.month), nextM=months.find(x=>x>S.month);
    if(!DAYLIST.length){
      $('#cal').innerHTML=`<div class="cal"><div class="empty" style="padding:20px 8px">${icon('calendar',22)}<p style="margin:8px 0 0">This section has no class days.<br>Check the dates and meeting times in <a href="#/sections/edit/${sec.id}">Edit section</a>.</p></div></div>`;
      drawPend(); return;
    }
    let cells='';
    for(let i=0;i<cellsN;i++){
      const d=new Date(y,m-1,1-first.getDay()+i), k=iso(d);
      // Only class days are shown; every other day is left blank so it can't be confused or picked
      if(!ALLOWED.has(k)||d.getMonth()!==m-1){ cells+='<span class="day blank" aria-hidden="true"></span>'; continue; }
      cells+=`<button type="button" class="day cls ${pend.has(k)?'pend':''} ${k===S.date?'sel':''} ${k===today()?'today':''}" data-d="${k}"
        title="${esc(meets.length?meets.filter(x=>x.day===d.getDay()).map(meetShort).join(', '):'Class day')}${pend.has(k)?' · attendance missing':rec.has(k)?' · recorded':''}"
        aria-label="${longDate(k)}${rec.has(k)?', attendance recorded':''}${pend.has(k)?', attendance missing':''}" ${k===S.date?'aria-pressed="true"':''}>${rec.has(k)?'<i></i>':''}${d.getDate()}</button>`;
    }
    $('#cal').innerHTML=`<div class="cal"><div class="cal-h"><button type="button" class="ibtn" data-mo="${prevM||''}" aria-label="Previous month with classes" ${prevM?'':'disabled'}>${icon('chevL')}</button>
      <b>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button type="button" class="ibtn" data-mo="${nextM||''}" aria-label="Next month with classes" ${nextM?'':'disabled'}>${icon('chevR')}</button></div>
      <div class="cal-g">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<span>${x}</span>`).join('')}${cells}</div>
      <div class="cal-l"><span><em class="lgd cls"></em>Class day</span><span><em class="lgd dot"></em>Recorded</span><span><em class="lgd pnd"></em>Missing</span><span><em class="lgd tdy"></em>Today</span></div>
      <p class="muted small" style="margin:8px 0 0">${meets.length?`Only class days are shown: <b>${[...new Set(meets.map(x=>DAYS[x.day]))].join(', ')}</b>, ${fmt(sec.start_date)} – ${fmt(sec.end_date)}.`:`Any day from ${fmt(sec.start_date)} to ${fmt(sec.end_date)}. Add meeting times to show only class days.`}</p></div>`;
    $('#cal').querySelectorAll('[data-mo]:not([disabled])').forEach(b=>b.onclick=()=>{ S.month=b.dataset.mo; drawCal(); });
    $('#cal').querySelectorAll('[data-d]:not([disabled])').forEach(b=>b.onclick=()=>go(b.dataset.d,undefined,S.tab==='history'?'manual':S.tab));
    drawPend();
  };
  /* Banner listing past classes that still need attendance */
  const drawPend=()=>{
    const p=pendingDays(sec);
    $('#pendBar').innerHTML=p.length?`<div class="note pendnote">${icon('alert',16)}<span><b>${p.length} past class${p.length>1?'es':''} without attendance.</b> Click one to fill it in:</span>
      <span class="chips">${p.slice(0,6).map(x=>`<button type="button" class="chip pchip ${x.date===S.date&&x.mi===S.mi?'on':''}" data-pd="${x.date}" data-pmi="${x.mi}">${fmt(x.date)}${meets.length>1?' · '+esc(meetShort(meets[x.mi]).split(' ')[0]):''}</button>`).join('')}${p.length>6?`<span class="muted small">+${p.length-6} more (see History)</span>`:''}</span></div>`:'';
    $('#pendBar').querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>go(b.dataset.pd,Number(b.dataset.pmi),'manual'));
  };

  const drawManual=(focus)=>{
    const people=roster(sec.id);
    const recs=Object.fromEntries(attFor(sec.id,S.date,S.mi).map(a=>[a.student_id,a]));
    if(!S.draft){ S.draft={}; Object.values(recs).forEach(a=>S.draft[a.student_id]=a.status); }
    const cnt=k=>people.filter(p=>S.draft[p.id]===k).length, unmarked=people.filter(p=>!S.draft[p.id]).length;
    const days=DAYLIST, notClass=!ALLOWED.has(S.date), future=S.date>today();
    const prev=[...days].reverse().find(d=>d<S.date), next=days.find(d=>d>S.date&&d<=today());
    if(notClass){ // safety net: never take attendance on a day without class
      $('#pane').innerHTML=`<div class="pad">${emptyState('calendar','No class on this day',days.length?`Pick a highlighted day in the calendar. Classes run ${meets.length?'on '+[...new Set(meets.map(x=>DAYS[x.day]))].join(', ')+' ':''}from ${fmt(sec.start_date)} to ${fmt(sec.end_date)}.`:`This section has no class days. Check its meeting times and dates in <a href="#/sections/edit/${sec.id}">Edit section</a>.`,'')}</div>`;
      return;
    }
    $('#pane').innerHTML=`<div class="hd daynav">
        <button class="ibtn" id="dPrev" ${prev?'':'disabled'} title="${prev?'Previous class: '+fmt(prev):'No earlier class'}" aria-label="Previous class">${icon('chevL')}</button>
        <div class="grow"><h3>${longDate(S.date)}${S.date===today()?' <span class="pill ok">Today</span>':''}</h3><span class="sub">${esc(schedLabel())}</span></div>
        <button class="ibtn" id="dNext" ${next?'':'disabled'} title="${next?'Next class: '+fmt(next):'No later class up to today'}" aria-label="Next class">${icon('chevR')}</button>
        ${people.length&&!future?`<button class="btn secondary sm" id="allP">${icon('check',14)}Mark all present</button>`:''}</div>
      ${people.length&&future?`<div class="pad">${emptyState('calendar','This class has not happened yet',`You can take attendance on or after ${fmt(S.date)}. Use the calendar or the arrows to pick a past or today's class.`,days.filter(d=>d<=today()).length?`<button class="btn primary" id="goLast">Go to the latest class</button>`:'')}</div>`:''}
      ${people.length&&!future?`
        <div class="att-sum">${Object.entries(ATT).map(([k,[l,,t]])=>`<span class="pill ${t}">${l}: ${cnt(k)}</span>`).join('')}<span class="pill">Not marked: ${unmarked}</span></div>
        ${S.date<today()&&!Object.keys(recs).length?`<div class="note info" style="margin:0 18px 12px">${icon('calendar',16)}<span>You are recording attendance for a past class. Mark each student and press <b>Save attendance</b>.</span></div>`:''}
        <ul class="roll">${people.map(p=>{const r=recs[p.id];return `<li>${who(p)}
          ${r?.method==='qr'?`<span class="qrb" title="Self check-in">${icon('qr',13)}Checked in ${tShort(r.time)}</span>`:''}
          <div class="seg att-seg" role="radiogroup" aria-label="Attendance for ${esc(studentName(p))}">${Object.entries(ATT).map(([k,[l,a,t]])=>`<label title="${l}"><input type="radio" name="a${p.id}" value="${k}" ${S.draft[p.id]===k?'checked':''}><span class="${t}">${a}<span class="lng">${l.slice(1)}</span></span></label>`).join('')}</div></li>`;}).join('')}</ul>
        <div class="pane-f"><span class="muted small">${S.dirty?`<b style="color:var(--amber)">● Unsaved changes</b>`:`${icon('check',14)} Saved`}</span>
          <div class="btns"><button class="btn secondary" id="clrA">Clear</button><button class="btn primary" id="saveA">${icon('check',16)}Save attendance</button></div></div>`
      :''}${people.length?'':emptyState('users','No enrolled students','Enroll students in this section to take attendance.',btn(`#/enrollments/bulk?section=${sec.id}`,'userplus','Add students'))}`;
    const pv=$('#dPrev'), nx=$('#dNext'), gl=$('#goLast');
    if(pv) pv.onclick=()=>prev&&go(prev); if(nx) nx.onclick=()=>next&&go(next);
    if(gl) gl.onclick=()=>go(days.filter(d=>d<=today()).pop());
    if(!people.length||future) return;
    $('#pane').querySelectorAll('.roll input').forEach(inp=>inp.onchange=()=>{ S.draft[inp.name.slice(1)]=inp.value; S.dirty=true; drawManual(inp.name+'|'+inp.value); });
    $('#allP').onclick=()=>{ people.forEach(p=>S.draft[p.id]='present'); S.dirty=true; drawManual(); };
    $('#clrA').onclick=()=>{ S.draft={}; S.dirty=true; drawManual(); };
    $('#saveA').onclick=()=>{
      const now=nowLocal();
      for(const p of people){
        const v=S.draft[p.id], r=db.attendance.find(a=>a.section_id===sec.id&&a.student_id===p.id&&a.date===S.date&&a.meeting===S.mi);
        if(v&&r){ if(r.status!==v){ r.status=v; r.updated=now; } }
        else if(v) insert('attendance',{section_id:sec.id,student_id:p.id,date:S.date,meeting:S.mi,status:v,method:'manual',time:now});
        else if(r) db.attendance=db.attendance.filter(a=>a!==r);
      }
      save(); S.dirty=false; S.draft=null; drawCal(); drawManual();
      const nextPend=pendingDays(sec)[0];
      if(nextPend) toast(`Attendance saved for ${fmt(S.date)}`,false,{label:`Next missing: ${fmt(nextPend.date)}`,run:()=>go(nextPend.date,nextPend.mi,'manual')});
      else toast(`Attendance saved for ${fmt(S.date)}`);
    };
    if(focus){ const [n,v]=focus.split('|'); $(`#pane input[name="${n}"][value="${v}"]`)?.focus(); }
  };

  const drawQR=()=>{
    const ses=db.sessions.find(s=>s.section_id===sec.id&&s.date===S.date&&s.meeting===S.mi&&s.open);
    const people=roster(sec.id);
    const hdr=`<div class="hd"><div><h3>Self check-in · ${fmt(S.date)}</h3><span class="sub">${esc(schedLabel())}</span></div>${ses?'<span class="pill ok">Open</span>':'<span class="pill">Not started</span>'}</div>`;
    if(!ses&&S.date!==today()){
      const todayCls=ALLOWED.has(today());
      $('#pane').innerHTML=hdr+`<div class="pad">${emptyState('qr','QR check-in is only for today\'s class',
        S.date<today()?`${fmt(S.date)} already passed. To record or correct attendance for that day, use Manual entry.`:`${fmt(S.date)} has not happened yet. Start the QR check-in on the day of the class.`,
        `<div class="btns-row" style="justify-content:center">${S.date<today()?`<button class="btn primary" id="toMan">${icon('calendar',16)}Record ${fmt(S.date)} manually</button>`:''}${todayCls?`<button class="btn secondary" id="toToday">${icon('qr',16)}Go to today</button>`:''}</div>`)}</div>`;
      const tm=$('#toMan'); if(tm) tm.onclick=()=>go(S.date,S.mi,'manual');
      const tt=$('#toToday'); if(tt) tt.onclick=()=>go(today(),undefined,'qr');
      return;
    }
    const note=CLOUD?`<div class="note info">${icon('wifi',16)}<span>Works from <b>any phone with internet</b> (Wi-Fi or mobile data). Parents don't need a password.</span></div>`
      :SYNC?`<div class="note info">${icon('wifi',16)}<span>Phones must be on the <b>same Wi-Fi</b> as this computer (not on mobile data).</span></div>
        <details class="trouble"><summary>The QR doesn't open on the phone?</summary><ol>
          <li>Check that the phone is connected to the same Wi-Fi network as this computer, with mobile data turned off.</li>
          <li>Keep the black <b>server window</b> (Iniciar.bat) open during the class.</li>
          <li>If Windows asks whether Python may use the network, choose <b>Allow</b>.</li>
          <li>Guest or school Wi-Fi networks sometimes block devices from talking to each other. Then use the <b>kiosk</b> on this computer or a tablet instead.</li>
          <li>You can also type this address in the phone browser: <b>${esc(API?.ip||'')}:${esc(API?.port||'')}</b></li></ol></details>`
      :serverHelp();
    if(!ses){
      $('#pane').innerHTML=hdr+`<div class="pad">
        <ol class="howto"><li>Start check-in for the selected date.</li><li>Students scan the QR code with their phone camera.</li><li>They type only their <b>name</b> and <b>phone number</b>.</li><li>They are marked <b>Present</b> automatically and appear here.</li></ol>
        ${note}
        ${people.length?`<button class="btn primary" id="startQ">${icon('qr',16)}Start check-in for ${fmt(S.date)}</button>`:'<p class="muted">There are no enrolled students in this section yet.</p>'}</div>`;
      const b=$('#startQ'); if(b) b.onclick=()=>{ insert('sessions',{section_id:sec.id,date:S.date,meeting:S.mi,token:newToken(),open:true,created:nowLocal()}); save(); drawQR(); };
      wireMove();
      return;
    }
    const url=(CLOUD?location.origin+'/':SYNC&&API?.ip?`http://${API.ip}:${API.port}/`:location.href.split('#')[0])+'#/checkin/'+ses.token;
    const checked=attFor(sec.id,S.date,S.mi).filter(a=>a.method==='qr').sort((a,b)=>(b.time||'').localeCompare(a.time||''));
    $('#pane').innerHTML=hdr+`<div class="qr-wrap">
        ${SYNC?`<div class="qr-box"><div id="qr" role="img" aria-label="QR code to check in"></div><p class="muted small">Scan with the phone camera</p></div>`:''}
        <div class="qr-side">${note}
          ${SYNC?`<label class="lb" for="qurl">Check-in link</label><div class="copy"><input id="qurl" readonly value="${esc(url)}"><button class="btn secondary sm" id="cpy">Copy</button></div>`:''}
          <div class="btns-row"><a class="btn secondary" href="${esc(url)}" target="_blank" rel="noopener">${icon('eye',16)}Open kiosk on this device</a><button class="btn danger" id="closeQ">${icon('x',16)}Close check-in</button></div>
        </div></div>
      <div class="hd" style="border-top:1px solid var(--border)"><h3>Checked in (${checked.length} of ${people.length})</h3><span class="muted small">Updates automatically</span></div>
      ${checked.length?`<ul class="roll">${checked.map(a=>`<li>${who(get('students',a.student_id))}<span class="pill ok">${tShort(a.time)}</span></li>`).join('')}</ul>`
        :`<div class="empty" style="padding:28px">${icon('qr',22)}<p style="margin:8px 0 0">Waiting for the first check-in…</p></div>`}`;
    if(SYNC) renderQR($('#qr'),url);
    wireMove();
    const cpy=$('#cpy'); if(cpy) cpy.onclick=()=>{ navigator.clipboard?.writeText(url).then(()=>toast('Link copied'),()=>{ $('#qurl').select(); }); };
    $('#closeQ').onclick=async()=>{ if(await ask({title:'Close check-in?',msg:'Students will no longer be able to check in with this QR code. Attendance already recorded is kept.',ok:'Close check-in'})){ ses.open=false; save(); drawQR(); toast('Check-in closed'); } };
  };

  /* History: every class day up to today × every student */
  const drawHistory=()=>{
    const people=roster(sec.id), t=today();
    const cols=(meets.length?meets.flatMap((m,mi)=>classDays(sec,mi).map(d=>({d,mi}))):[...new Set(db.attendance.filter(a=>a.section_id===sec.id).map(a=>a.date))].map(d=>({d,mi:-1})))
      .filter(c=>c.d<=t).sort((a,b)=>a.d.localeCompare(b.d)||a.mi-b.mi);
    const recOf=(p,c)=>db.attendance.find(a=>a.section_id===sec.id&&a.student_id===p.id&&a.date===c.d&&a.meeting===c.mi);
    const taken=c=>db.attendance.some(a=>a.section_id===sec.id&&a.date===c.d&&a.meeting===c.mi);
    $('#pane').innerHTML=`<div class="hd"><div><h3>Attendance history</h3><span class="sub">${cols.length} class${cols.length===1?'':'es'} so far · click a date or a cell to open that day</span></div></div>
      ${!people.length?emptyState('users','No enrolled students','Enroll students in this section to see their history.',''):!cols.length?emptyState('calendar','No classes yet','Past and today\'s classes will appear here.',''):`
      <div class="tw"><table class="hist"><thead><tr><th class="hn">Student</th>${cols.map(c=>`<th class="${taken(c)?'':'miss'}"><button type="button" data-hd="${c.d}" data-hmi="${c.mi}" title="${longDate(c.d)}${taken(c)?'':' · attendance missing'}">${D(c.d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}${meets.length>1?`<small>${esc(DAYS[meets[c.mi].day].slice(0,3))}</small>`:''}</button></th>`).join('')}<th>Rate</th></tr></thead>
      <tbody>${people.map(p=>`<tr><td class="hn">${esc(studentName(p))}</td>${cols.map(c=>{const r=recOf(p,c);const a=r?ATT[r.status]:null;return `<td class="hc"><button type="button" class="hcell ${a?a[2]:taken(c)?'none':'miss'}" data-hd="${c.d}" data-hmi="${c.mi}" title="${esc(studentName(p))} · ${fmt(c.d)}: ${a?a[0]:'not marked'}">${a?a[1]:'–'}</button></td>`;}).join('')}<td>${rateHtml(sec.id,p.id)}</td></tr>`).join('')}</tbody></table></div>
      <div class="cal-l" style="padding:10px 18px 14px">${Object.values(ATT).map(([l,a,tn])=>`<span><b class="hcell ${tn} key">${a}</b>${l}</span>`).join('')}<span><b class="hcell miss key">–</b>Not taken</span></div>`}`;
    $('#pane').querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>go(b.dataset.hd,Number(b.dataset.hmi),'manual'));
  };

  const drawPane=()=>{ app.querySelectorAll('[data-tab]').forEach(b=>{ const on=b.dataset.tab===S.tab; b.setAttribute('aria-selected',on); b.classList.toggle('on',on); }); S.tab==='qr'?drawQR():S.tab==='history'?drawHistory():drawManual(); };
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{ if(b.dataset.tab===S.tab) return; if(!await confirmLeave()) return; S.dirty=false; S.draft=null; S.tab=b.dataset.tab; drawPane(); });
  // Choosing another meeting time jumps to that meeting's most recent class day
  $('#amt').onchange=async e=>{
    if(!await confirmLeave()){ e.target.value=S.mi; return; }
    S.mi=Number(e.target.value);
    if(S.mi>=0&&D(S.date).getDay()!==meets[S.mi].day){ const d=latest(classDays(sec,S.mi)); if(d) S.date=d; }
    S.month=S.date.slice(0,7); S.draft=null; S.dirty=false; drawCal(); drawPane();
  };
  VIEW.refresh=()=>{ drawCal(); if(S.tab==='qr') drawQR(); else if(S.tab==='history') drawHistory(); else if(!S.dirty){ S.draft=null; drawManual(); } };
  $('#amt').value=S.mi;
  drawCal(); drawPane();
}

/* ---- Where the app runs: online (Netlify), local server (Iniciar.bat) or the file opened directly ---- */
const FILE_MODE=location.protocol==='file:';
const SERVER_URL='http://localhost:8765';
const CLOUD_URL='https://prcapp.netlify.app';
function serverHelp(){
  if(FILE_MODE) return `<div class="note">${icon('alert',16)}<div><b>Phones can't scan the QR in this version.</b> You opened <i>index.html</i> directly from the computer.
      Use the online version at <a href="${CLOUD_URL}" target="_blank" rel="noopener"><b>prcapp.netlify.app</b></a>: the QR works there from any phone.
      <div class="btns-row" style="margin-top:10px"><button type="button" class="btn primary sm" data-move="cloud">${icon('wifi',14)}Move my data to the online version</button>
      <button type="button" class="btn secondary sm" data-move="local">Move it to Iniciar.bat instead</button></div>
      <span class="muted small" style="display:block;margin-top:6px">Meanwhile you can still use this computer as a check-in kiosk.</span></div></div>`;
  return `<div class="note">${icon('alert',16)}<span>Phones can't reach this page. Use the online version at <a href="${CLOUD_URL}"><b>prcapp.netlify.app</b></a>.</span></div>`;

function wireMove(){ document.querySelectorAll('[data-move]').forEach(b=>b.onclick=e=>{ e.preventDefault(); moveToServer(b.dataset.move==='local'?SERVER_URL:CLOUD_URL); }); }
/* Copies this browser's data into the online/server version (opens it in a new window and hands the data over) */
async function moveToServer(target=CLOUD_URL){
  const online=target===CLOUD_URL;
  if(!await ask({title:online?'Move your data to the online version?':'Move your data to the Iniciar.bat version?',
    msg:online?'A new window opens the online version. Sign in with the staff password and confirm the copy there. The data currently online will be replaced.'
              :'First double-click Iniciar.bat so the server is running. A new window will open; confirm the copy there. Its current data will be replaced.',ok:'Continue',danger:false})) return;
  const w=window.open(target+'/#/receive','prc-'+(online?'cloud':'server'));
  if(!w){ toast('The browser blocked the new window. Allow pop-ups for this page and try again.',true); return; }
  let ready=false;
  const onMsg=e=>{
    if(e.source!==w||e.origin!==target) return;
    if(e.data?.type==='prc-ready'){ ready=true; w.postMessage({type:'prc-data',data:db},target); }
    if(e.data?.type==='prc-done'){ window.removeEventListener('message',onMsg); toast(`Done! Your data is in the ${online?'online':'server'} version. Use that window from now on.`); }
  };
  window.addEventListener('message',onMsg);
  if(!online) setTimeout(()=>{ if(!ready) toast('The server version did not answer. Double-click Iniciar.bat, wait a few seconds and try again.',true); },8000);
}
/* Server side of the hand-over: #/receive */
function receiveView(){
  app.innerHTML=pageHead({title:'Move data to the server version'})+`<div class="card pad" id="rcv"><p class="muted">Waiting for the data from the other window…</p></div>`;
  if(!SYNC){ $('#rcv').innerHTML=`<p>Open this page from the online version (<b>${CLOUD_URL}</b>) or from Iniciar.bat (<b>${SERVER_URL}</b>).</p>`; return; }
  if(!window.opener){ $('#rcv').innerHTML=`<p>Open the old version (index.html) and click <b>Move my data to the server version</b>.</p><a class="btn secondary" href="#/overview">Go to Home</a>`; return; }
  const onMsg=e=>{
    if(e.source!==window.opener||e.data?.type!=='prc-data') return;
    window.removeEventListener('message',onMsg);
    const d=e.data.data;
    if(!d||!CORE.every(t=>Array.isArray(d[t]))){ $('#rcv').innerHTML='<p>The data received is not valid.</p>'; return; }
    $('#rcv').innerHTML=`<p>Received from the offline version: <b>${d.students.length} students, ${d.sections.length} sections, ${d.enrollments.length} enrollments, ${(d.attendance||[]).length} attendance records</b>.</p>
      <p class="muted">This version currently has ${db.students.length} students and ${db.sections.length} sections; they will be replaced.</p>
      <div class="btns-row"><button class="btn primary" id="rcvOk">${icon('check',16)}Replace with my data</button><a class="btn secondary" href="#/overview">Cancel</a></div>`;
    $('#rcvOk').onclick=()=>{
      db=normalize(JSON.parse(JSON.stringify(d))); save();
      try{ window.opener.postMessage({type:'prc-done'},'*'); }catch(_){}
      location.hash='#/overview'; toast('Your data is now in the server version');
    };
  };
  window.addEventListener('message',onMsg);
  window.opener.postMessage({type:'prc-ready'},'*');
}

let qrLib;
function renderQR(el,text){
  qrLib=qrLib||new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  qrLib.then(()=>{ el.innerHTML=''; new QRCode(el,{text,width:230,height:230,colorDark:'#16365c',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); })
       .catch(()=>{ qrLib=null; el.innerHTML='<p class="muted small" style="max-width:220px">The QR code needs an internet connection to draw. Share the link instead.</p>'; });
}

/* Mark a student present from a self check-in */
function markQr(sec,stu,date,mi,time){
  const a=db.attendance.find(x=>x.section_id===sec&&x.student_id===stu&&x.date===date&&x.meeting===mi);
  if(a){ if(a.status!=='present'&&a.status!=='late') a.status='present'; a.method='qr'; a.time=time; }
  else insert('attendance',{section_id:sec,student_id:stu,date,meeting:mi,status:'present',method:'qr',time});
}
/* Import check-ins received by server.py */
async function pullCheckins(){
  if(!SYNC) return;
  let r; try{ r=await api('/api/checkins'); }catch(e){ return; }
  if(!r.ok||!Array.isArray(r.data)) return;
  const idOf=c=>c.key||c.uid;
  const done=new Set(db.ckImported); let n=0;
  for(const c of r.data){ if(done.has(idOf(c))) continue; markQr(c.section_id,c.student_id,c.date,c.meeting,c.time); db.ckImported.push(idOf(c)); n++; }
  if(!CLOUD){ if(n){ save(); VIEW.refresh?.(); } return; }
  // Online: save the new attendance first, then tell the server those check-ins are stored
  let saved=true;
  if(n){ clearTimeout(putTimer); saved=await doPush(); VIEW.refresh?.(); }
  const keys=r.data.map(idOf).filter(k=>db.ckImported.includes(k));
  if(saved&&keys.length&&!putBusy){
    await api('/api/checkins/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys})}).catch(()=>{});
    db.ckImported=db.ckImported.filter(k=>!keys.includes(k));
  }
}
/* Check-in on this same device (kiosk, no server) */
function localCheckin(tok,name,phone){
  db=load();
  const s=db.sessions.find(x=>x.token===tok&&x.open&&x.date===today()); if(!s) return {ok:false,code:'closed'};
  const nm=normName(name), ph=normPhone(phone);
  if(!nm) return {ok:false,code:'name'};
  if(ph.length<7) return {ok:false,code:'phone'};
  const st=roster(s.section_id).find(p=>normPhone(p.phone)===ph&&nameMatch(p,nm));
  if(!st) return {ok:false,code:'nomatch'};
  const already=db.attendance.some(a=>a.section_id===s.section_id&&a.student_id===st.id&&a.date===s.date&&a.meeting===s.meeting&&a.method==='qr');
  if(!already){ markQr(s.section_id,st.id,s.date,s.meeting,nowLocal()); save(); }
  return {ok:true,already,first_name:st.first_name};
}

/* ================= Router ================= */
function route(){
  const [path,qs]=(location.hash.slice(2)||'overview').split('?');
  const [t,action,id]=path.split('/'); const q=new URLSearchParams(qs||'');
  VIEW={};
  if(t==='checkin') return checkinView(action||'');
  document.body.classList.remove('kiosk');
  const cur=E[t]||t==='overview'||t==='attendance'?t:'overview';
  const pendN=allPending().length;
  $('#nav').innerHTML=TABS.map(([k,l,ic])=>!l?`<span class="ng">${k}</span>`:`<a href="#/${k}" class="${k===cur?'active':''}" ${k===cur?'aria-current="page"':''}>${icon(ic)}${l}${E[k]?`<span class="n">${db[k].length}</span>`:k==='attendance'&&pendN?`<span class="n warn" title="${pendN} past classes without attendance">${pendN}</span>`:''}</a>`).join('');
  $('#foot').innerHTML=CLOUD?`<span>${icon('wifi',14)} Online · data shared by all staff<br><a href="#" id="logout">Sign out</a></span>`
    :SYNC?icon('wifi',14)+'Server on · QR check-in ready'
    :FILE_MODE?`<span>${icon('db',14)} Offline version · QR for phones is off<br><a href="#" data-move>Move my data to the online version</a></span>`
    :icon('db',14)+'Saved in this browser';
  wireMove();
  const lo=$('#logout'); if(lo) lo.onclick=e=>{ e.preventDefault(); logout(); };
  document.title=(E[t]?E[t].many+' · ':t==='attendance'?'Attendance · ':'')+'Parent Resource Centers';
  window.scrollTo(0,0);
  if(t==='receive') return receiveView();
  if(t==='attendance') return action?attendanceView(Number(action),q):attendanceHome();
  if(!E[t]) return overview();
  if(t==='enrollments'&&action==='bulk') return bulkView(q);
  if(action==='new'){ // values passed in the link, e.g. #/enrollments/new?student_id=3
    const preset={}; q.forEach((v,k)=>{ preset[k]=/_id$/.test(k)?Number(v):v; });
    return formView(t,null,Object.keys(preset).length?preset:null);
  }
  if(action==='edit') return formView(t,Number(id));
  if(action==='view'&&t==='sections') return sectionView(Number(id));
  if(action==='view'&&t==='students') return studentView(Number(id));
  listView(t);
}
document.addEventListener('keydown',e=>{ if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ const s=$('#q')||$('#bq'); if(s){ e.preventDefault(); s.focus(); } } });
// Another tab (e.g. the kiosk) changed the data
window.addEventListener('storage',e=>{ if(!CLOUD&&e.key===KEY&&!location.hash.startsWith('#/checkin')){ db=load(); VIEW.refresh?.(); } });

async function init(){
  if(location.protocol.startsWith('http')){
    try{
      const i=await api('/api/info');
      if(i.ok&&i.data?.mode==='cloud'){
        // Online version: parents' check-in page needs no sign-in; everything else does
        API=i.data; CLOUD=true;
        window.addEventListener('hashchange',()=>{ if(SYNC||location.hash.startsWith('#/checkin')) route(); });
        if(location.hash.startsWith('#/checkin')){ db=blank(); return route(); }
        if(await cloudLoad()){ startSync(); return route(); }
        return loginView();
      }
      if(i.ok&&i.data?.port){
        API=i.data;
        if(API.local){ const d=await api('/api/data'); if(d.ok){ SYNC=true; if(d.data&&Array.isArray(d.data.terms)){ db=normalize(d.data); try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){} } } }
      }
    }catch(e){}
  }
  if(!location.hash.startsWith('#/checkin')){
    if(!db) db=load();
    if(SYNC){ pushServer(); startSync(); }
  }
  window.addEventListener('hashchange',route);
  route();
}
init();
</script>
</body>
</html>
